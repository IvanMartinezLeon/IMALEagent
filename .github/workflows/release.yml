name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Ningún release se publica sin pasar antes las validaciones (workflow_call).
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release tarball
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Solo assets verificables: el entry point install.sh (raíz), el tarball y
          # sus checksums. install/install.*.ps1|bat NO se publican sueltos porque
          # necesitan el árbol del repo; van dentro del tarball y el README explica
          # cómo usarlos desde ahí.
          gh release create "${GITHUB_REF_NAME}" \
            dist/imaleagent-"${GITHUB_REF_NAME}".tar.gz \
            dist/imaleagent.tar.gz \
            dist/SHA256SUMS \
            install.sh \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
